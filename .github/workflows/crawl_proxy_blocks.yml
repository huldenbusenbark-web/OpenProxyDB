name: Crawl Wikipedia Proxy Blocks

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    # Run daily at 00:22 UTC
    - cron: '22 0 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore data files from folder
        run: |
          if [ -f "data/last_crawl_time.txt" ]; then
            cp data/last_crawl_time.txt last_crawl_time.txt
            echo "Loaded last_crawl_time.txt from data folder"
          fi
          if [ -f "data/block_metadata.csv" ]; then
            cp data/block_metadata.csv block_metadata.csv
            echo "Loaded block_metadata.csv from data folder"
          fi

      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.crawler

      - name: Set tag name
        run: |
          echo "TAG_NAME=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

      - name: Commit and push data files to data folder
        run: |
          mkdir -p data
          cp proxy_blocks.csv data/proxy_blocks.csv
          if [ -f "block_metadata.csv" ]; then
            cp block_metadata.csv data/block_metadata.csv
          fi
          if [ -f "last_crawl_time.txt" ]; then
            cp last_crawl_time.txt data/last_crawl_time.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update proxy blocks data $(date +'%Y-%m-%d') [skip ci]"
            git push origin main
          fi

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Proxy Blocks ${{ env.TAG_NAME }}
          body: |
            Proxy block list updated on ${{ env.TAG_NAME }}
            
            - New IPs added: ${{ env.IPS_ADDED }}
            - IPs removed: ${{ env.IPS_REMOVED }}
            - Total IPs: ${{ env.TOTAL_IPS }}
            
            This release contains IP addresses blocked by Wikipedia for proxy-related reasons.
          files: proxy_blocks.csv
            
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 2
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 2
